<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로켓샐러드 검색기</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    #wrap {
      max-width: 800px;
      margin: 0 auto;
    }

    /* 입력 영역 */
    #search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    #keyword {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    #btn-search {
      padding: 12px 20px;
      background: #4a68ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    /* 상태표시 */
    #status {
      text-align: center;
      margin: 15px 0;
      font-weight: bold;
      color: #555;
    }

    /* 결과 그리드 */
    #results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 15px;
    }

    /* 카드 */
    .item-card {
      background: white;
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 8px;
    }

    .title {
      font-size: 14px;
      font-weight: bold;
      color: #222;
      min-height: 36px;
    }

    .price {
      font-size: 14px;
      color: #555;
    }

    .link-btn {
      margin-top: auto;
      background: #4a68ff;
      color: white;
      padding: 8px 10px;
      text-align: center;
      border-radius: 6px;
      font-size: 14px;
      text-decoration: none;
    }

    /* 로딩 스피너 */
    .loader {
      border: 5px solid #eee;
      border-top: 5px solid #4a68ff;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
      display: none;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

  </style>
</head>

<body>
  <div id="wrap">
    <h1>로켓샐러드 검색기</h1>

    <!-- 검색창 -->
    <div id="search-box">
      <input id="keyword" placeholder="검색어 입력 (예: jacket, nike, denim)">
      <button id="btn-search">검색</button>
    </div>

    <!-- 상태 -->
    <div id="status">검색어를 입력하세요.</div>
    <div class="loader" id="loader"></div>

    <!-- 결과 -->
    <div id="results"></div>
  </div>

  <script>
    const API_URL = "/api/scrape";

    document.getElementById("btn-search").addEventListener("click", search);

    async function search() {
      const keyword = document.getElementById("keyword").value.trim();
      const status = document.getElementById("status");
      const resultsDiv = document.getElementById("results");
      
      if (!keyword) {
        alert("검색어를 입력해주세요.");
        return;
      }

      status.innerText = "검색 중...";
      resultsDiv.innerHTML = "";
      showLoader(true);

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ keyword })
        });

        const data = await res.json();
        console.log("응답:", data);

        // 🔥 서버 오류 시 중단
        if (!data.success) {
          status.innerText = "서버 오류 발생!";
          showLoader(false);
          console.error(data);
          return;
        }

        // 🔥 items 검증 (forEach 오류 방지)
        if (!data.items || !Array.isArray(data.items)) {
          status.innerText = "검색 실패 (items 없음)";
          showLoader(false);
          console.error("SERVER RESPONSE ERROR:", data);
          return;
        }

        status.innerText = `검색 완료: ${data.count}개 찾음`;
        renderResults(data.items);

      } catch (err) {
        status.innerText = "요청 실패 (네트워크 오류)";
        console.error(err);
      }

      showLoader(false);
    }

    function renderResults(items) {
      const resultsDiv = document.getElementById("results");
      resultsDiv.innerHTML = "";

      items.forEach(item => {
        const card = document.createElement("div");
        card.className = "item-card";

        const imgSrc = item.img || "https://via.placeholder.com/200x200?text=No+Image";

        card.innerHTML = `
          <img src="${imgSrc}">
          <div class="title">${item.title}</div>
          <div class="price">${item.price ?? "가격 정보 없음"}</div>
          <a class="link-btn" href="${item.link}" target="_blank">상품 보기</a>
        `;

        resultsDiv.appendChild(card);
      });
    }

    function showLoader(flag) {
      document.getElementById("loader").style.display = flag ? "block" : "none";
    }

  </script>

</body>
</html>
